# Requires a Compose driver. On Ubuntu, if `docker compose` fails, install one of:
#   sudo apt install docker-compose-v2    # then: docker compose up -d db
#   sudo apt install docker-compose       # then: docker-compose up -d db
#
# If you see "permission denied" on /var/run/docker.sock:
#   sudo usermod -aG docker "$USER" && newgrp docker
#   (then log out and back in). Or run once: sudo docker compose up -d db
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jfp
      POSTGRES_PASSWORD: jfp
      POSTGRES_DB: jaifancypacks
    # Host 5433 avoids clashing with a local PostgreSQL install on 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
